name: Deploy Pila-Plats to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pila-plats-app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ./pila-plats-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Google OAuth configuration
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Missing VITE_GOOGLE_CLIENT_ID. Add it as a repository/environment variable or secret in GitHub, then re-run this workflow."
            exit 1
          fi

      - name: Build site
        run: npm run build

      - name: Add Pages SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pila-plats-app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
